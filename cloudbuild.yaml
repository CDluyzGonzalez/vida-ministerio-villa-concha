# ============================================================
# Google Cloud Build: Pipeline de Despliegue a Cloud Run
# ============================================================

steps:
  # 1. Construir la imagen de contenedor con Docker
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vida-ministerio-villa-concha:$COMMIT_SHA'
      - '.'

  # 2. Subir la imagen al Container Registry de Google Cloud
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vida-ministerio-villa-concha:$COMMIT_SHA'

  # 3. Desplegar en Google Cloud Run (Escala a 0, Capa Gratuita Permanente)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vida-ministerio'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vida-ministerio-villa-concha:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '3'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/vida-ministerio-villa-concha:$COMMIT_SHA'
